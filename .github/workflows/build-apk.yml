name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.x
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate platform folders
        run: flutter create . --project-name self_dev_app --org com.selfdev --platforms=android

      - name: Patch Android manifest (notifications)
        run: bash scripts/patch_android_manifest.sh

      - name: Patch Android signing config
        run: python3 scripts/patch_android_signing.py

      - name: Create .env
        run: |
          cat > .env <<EOF
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          BOOK_TOC_PROXY_URL=${{ secrets.BOOK_TOC_PROXY_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, split per ABI)
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --split-per-abi

      - name: Build universal APK (fallback)
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      - name: Verify APK signing (SHA-256 fingerprint)
        run: |
          set -e
          echo "::group::Built APK signatures"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "▶ $apk"
            $JAVA_HOME/bin/keytool -printcert -jarfile "$apk" 2>/dev/null \
              | grep -E "SHA256:|소유자|Owner" || true
          done
          echo "::endgroup::"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk        out/self-dev-app-arm64-v8a-build${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk      out/self-dev-app-armeabi-v7a-build${{ github.run_number }}.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk           out/self-dev-app-x86_64-build${{ github.run_number }}.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk                  out/self-dev-app-universal-build${{ github.run_number }}.apk
          ls -lh out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            **커밋:** `${{ github.sha }}`
            **브랜치:** `${{ github.ref_name }}`

            ## 📱 폰에 설치하는 방법
            1. 폰에서 본 페이지를 열고 **`self-dev-app-arm64-v8a-build${{ github.run_number }}.apk`** 다운로드 (대부분의 최신 안드로이드 폰)
            2. 다운로드한 파일을 탭 → "출처를 알 수 없는 앱 설치" 허용 → 설치
            3. 이미 설치된 앱이 있으면 자동으로 업데이트 (데이터 유지)

            > 본인 폰의 CPU가 32-bit이면 `armeabi-v7a` 버전을, 잘 모르면 `universal` 버전을 받으세요.
          files: out/*.apk
          fail_on_unmatched_files: true
