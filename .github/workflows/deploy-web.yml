name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.x
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate web platform
        run: flutter create . --project-name self_dev_app --org com.selfdev --platforms=web

      - name: Customize PWA manifest
        run: |
          cat > web/manifest.json <<'EOF'
          {
              "name": "Self-Dev",
              "short_name": "Self-Dev",
              "start_url": "./",
              "display": "standalone",
              "background_color": "#FFFFFF",
              "theme_color": "#3F51B5",
              "description": "자기계발을 위한 통합 앱 (독서·할일·문구·일기)",
              "orientation": "portrait-primary",
              "prefer_related_applications": false,
              "icons": [
                  {
                      "src": "icons/Icon-192.png",
                      "sizes": "192x192",
                      "type": "image/png"
                  },
                  {
                      "src": "icons/Icon-512.png",
                      "sizes": "512x512",
                      "type": "image/png"
                  },
                  {
                      "src": "icons/Icon-maskable-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "maskable"
                  },
                  {
                      "src": "icons/Icon-maskable-512.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "maskable"
                  }
              ]
          }
          EOF

      - name: Inject iOS PWA meta tags
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('web/index.html')
          html = p.read_text(encoding='utf-8')
          inject = '''
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="default">
            <meta name="apple-mobile-web-app-title" content="Self-Dev">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="theme-color" content="#3F51B5">
            <link rel="apple-touch-icon" href="icons/Icon-192.png">
            <style>
              html, body {
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
              }
            </style>
          '''
          if 'apple-mobile-web-app-capable' not in html:
              html = re.sub(r'(<title>.*?</title>)', inject + r'\1', html, count=1, flags=re.S)
          # 모바일 가상 키보드가 viewport 를 축소하도록 viewport 메타 태그 보강.
          # 이게 없으면 iOS Safari PWA 에서 키보드가 떴을 때 커서/입력 위치가
          # 화면 하단으로 밀려 보이는 문제가 발생.
          html = re.sub(
              r'<meta name="viewport"[^>]*>',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, '
              'maximum-scale=1.0, user-scalable=no, viewport-fit=cover, '
              'interactive-widget=resizes-content">',
              html, count=1)
          p.write_text(html, encoding='utf-8')
          print('iOS PWA meta tags injected (+ viewport interactive-widget)')
          PY

      - name: Create .env
        run: |
          cat > .env <<EOF
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          BOOK_TOC_PROXY_URL=${{ secrets.BOOK_TOC_PROXY_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${REPO_NAME}/" \
            --build-number=${{ github.run_number }}

      - name: Patch service worker for instant updates
        run: |
          python3 - <<'PY'
          import pathlib, re
          sw = pathlib.Path('build/web/flutter_service_worker.js')
          src = sw.read_text(encoding='utf-8')
          # 새 SW 다운로드 즉시 활성화 + 기존 클라이언트 점유
          if 'self.skipWaiting()' not in src:
              src = re.sub(
                  r'(self\.addEventListener\("install",\s*\([^)]*\)\s*=>\s*\{)',
                  r'\1\n  self.skipWaiting();',
                  src, count=1)
          if 'self.clients.claim()' not in src:
              src = re.sub(
                  r'(self\.addEventListener\("activate",\s*\([^)]*\)\s*=>\s*\{)',
                  r'\1\n  self.clients.claim();',
                  src, count=1)
          sw.write_text(src, encoding='utf-8')
          print('flutter_service_worker.js patched (skipWaiting + clients.claim)')

          # Web Push 핸들러 추가 (push 이벤트 → showNotification)
          handler = pathlib.Path('web_patches/sw_push_handler.js').read_text(encoding='utf-8')
          src = sw.read_text(encoding='utf-8')
          if "addEventListener('push'" not in src and 'addEventListener("push"' not in src:
              sw.write_text(src + handler, encoding='utf-8')
              print('Web Push handler appended to SW')

          # (자동 새로고침은 사용자 입력을 끊을 수 있어 제거 — Dart 측 배너가 처리)
          PY

      - name: Generate monochrome notification badge
        run: |
          # Icon-192 는 불투명 배경이라 모노화하면 사각형이 됨.
          # 대신 빈 캔버스에 "S" 글자만 흰색으로 그려 투명 배경의 진짜 실루엣을 만든다.
          pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          font = None
          for path in [
              '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
              '/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf',
          ]:
              try:
                  font = ImageFont.truetype(path, 80)
                  break
              except Exception:
                  pass
          if font is None:
              font = ImageFont.load_default()
          draw.text((48, 48), 'S', font=font, fill=(255, 255, 255, 255), anchor='mm')
          img.save('build/web/icons/notification_badge.png', 'PNG')
          print('notification_badge.png generated (96x96, "S" silhouette)')
          PY
          ls -lh build/web/icons/

      - name: Add 404 fallback (SPA routing)
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
